<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" font-family="Helvetica,Arial,sans-serif">
  <title>Workflow comparison: host-driven vs in-container</title>
  <desc>
    The same five notebooks ship in two flavours. Host-driven: Jupyter on
    your host, EDA tools reached via `docker exec`. In-container: Jupyter
    inside the container alongside the tools, no `docker exec` indirection.
    Both write to the same bind-mounted workspace.
  </desc>

  <style>
    .title       { font-size:22px; fill:#111; text-anchor:middle; font-weight:bold; }
    .subtitle    { font-size:14px; fill:#444; text-anchor:middle; font-style:italic; }
    .panel-title { font-size:16px; fill:#111; font-weight:bold; text-anchor:middle; }
    .panel-sub   { font-size:12px; fill:#444; text-anchor:middle; font-style:italic; }
    .host-box    { fill:#eef6ff; stroke:#003b73; stroke-width:1.6; }
    .container-box { fill:#eefdef; stroke:#156b2e; stroke-width:1.6; }
    .label       { font-size:13px; fill:#111; font-weight:bold; }
    .kv          { font-size:11px; fill:#111; font-family:monospace; }
    .sub         { font-size:11px; fill:#444; }
    .bind        { fill:none; stroke:#b00; stroke-width:1.8; stroke-dasharray:5,3; marker-start:url(#arrowhead-red-l); marker-end:url(#arrowhead-red-r); }
    .bind-label  { font-size:11px; fill:#b00; font-weight:bold; }
    .arrow       { fill:none; stroke:#555; stroke-width:1.6; marker-end:url(#arrowhead); }
    .exec-label  { font-size:12px; fill:#444; font-weight:bold; }
    .port-label  { font-size:12px; fill:#0c5b1d; font-weight:bold; }
    .table-hd    { font-size:12px; fill:#111; font-weight:bold; }
    .table-cell  { font-size:11px; fill:#111; }
    .table-sub   { font-size:10px; fill:#666; font-style:italic; }
    .footer      { font-size:11px; fill:#777; text-anchor:middle; }
    .divider     { stroke:#bbb; stroke-width:1; stroke-dasharray:4,4; fill:none; }
  </style>

  <defs>
    <marker id="arrowhead" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L0,10 L9,5 z" fill="#555"/>
    </marker>
    <marker id="arrowhead-red-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L0,10 L9,5 z" fill="#b00"/>
    </marker>
    <marker id="arrowhead-red-l" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M9,0 L9,10 L1,5 z" fill="#b00"/>
    </marker>
  </defs>

  <!-- Header -->
  <text class="title"    x="600" y="32">Two workflows, same notebooks</text>
  <text class="subtitle" x="600" y="54">pick the one that matches your environment; both reach signoff on identical RTL/PDK</text>

  <!-- Divider between left/right panels -->
  <line class="divider" x1="600" y1="80" x2="600" y2="420"/>

  <!-- LEFT panel: host-driven -->
  <text class="panel-title" x="300" y="100">Host-driven</text>
  <text class="panel-sub"   x="300" y="118">parent directory · default</text>

  <rect class="host-box"      x="60"  y="138" width="220" height="140" rx="6"/>
  <text class="label"         x="170" y="156" text-anchor="middle">Host (laptop)</text>
  <text class="sub"           x="75"  y="178">Jupyter Lab</text>
  <text class="sub"           x="75"  y="195">docker daemon</text>
  <text class="sub"           x="75"  y="212">browser</text>
  <text class="kv"            x="75"  y="234">~/eda/designs/</text>
  <text class="sub"           x="95"  y="251">counter_demo/</text>
  <text class="sub"           x="95"  y="266">chipathon_padring/...</text>

  <rect class="container-box" x="320" y="138" width="220" height="140" rx="6"/>
  <text class="label"         x="430" y="156" text-anchor="middle">Container `gf180`</text>
  <text class="sub"           x="335" y="178">LibreLane, Yosys, Magic,</text>
  <text class="sub"           x="335" y="195">KLayout, Netgen, OpenROAD,</text>
  <text class="sub"           x="335" y="212">cocotb, iverilog</text>
  <text class="kv"            x="335" y="234">/foss/pdks/gf180mcuD/</text>
  <text class="kv"            x="335" y="252">/foss/designs/  (bind-mount)</text>

  <!-- docker exec arrow -->
  <path class="arrow" d="M 280 187 L 320 187"/>
  <text class="exec-label" x="300" y="178" text-anchor="middle">docker exec</text>

  <!-- bind-mount arrow -->
  <path class="bind" d="M 285 246 L 318 246"/>
  <text class="bind-label" x="300" y="262" text-anchor="middle">mount</text>

  <!-- Where Jupyter lives note -->
  <rect x="60" y="298" width="480" height="106" fill="#fff8e0" stroke="#bb8800" stroke-width="1" rx="4"/>
  <text class="label" x="80" y="318">Notebook cell pattern (host-driven):</text>
  <text class="kv"    x="80" y="338">subprocess.run([</text>
  <text class="kv"    x="80" y="354">    "docker", "exec", "gf180",</text>
  <text class="kv"    x="80" y="370">    "bash", "-lc", flow_script,</text>
  <text class="kv"    x="80" y="386">], ...)</text>
  <text class="sub"   x="80" y="402"><tspan font-style="italic">Every EDA tool call goes through `docker exec`.</tspan></text>

  <!-- RIGHT panel: in-container -->
  <text class="panel-title" x="900" y="100">In-container</text>
  <text class="panel-sub"   x="900" y="118">in_container/ subdirectory · all-in-one</text>

  <rect class="host-box"      x="660"  y="138" width="180" height="140" rx="6"/>
  <text class="label"         x="750"  y="156" text-anchor="middle">Host (laptop)</text>
  <text class="sub"           x="675"  y="180">docker daemon</text>
  <text class="sub"           x="675"  y="198">browser</text>
  <text class="kv"            x="675"  y="222">~/eda/designs/</text>
  <text class="sub"           x="695"  y="239">(same as left panel)</text>
  <text class="sub"           x="675"  y="265" font-style="italic">No Jupyter on host.</text>

  <rect class="container-box" x="880" y="138" width="260" height="140" rx="6"/>
  <text class="label"         x="1010" y="156" text-anchor="middle">Container `gf180`</text>
  <text class="sub"           x="895"  y="178" font-weight="bold">Jupyter Lab :8888</text>
  <text class="sub"           x="895"  y="195">+ LibreLane, Yosys, Magic,</text>
  <text class="sub"           x="895"  y="212">KLayout, cocotb, ...</text>
  <text class="kv"            x="895"  y="234">/foss/pdks/gf180mcuD/</text>
  <text class="kv"            x="895"  y="252">/foss/designs/  (bind-mount)</text>

  <!-- HTTP arrow -->
  <path class="arrow" d="M 840 187 L 880 187"/>
  <text class="port-label" x="860" y="178" text-anchor="middle">HTTP :8888</text>

  <!-- bind-mount arrow -->
  <path class="bind" d="M 845 246 L 878 246"/>
  <text class="bind-label" x="860" y="262" text-anchor="middle">mount</text>

  <!-- Where Jupyter lives note (right) -->
  <rect x="660" y="298" width="480" height="106" fill="#f0f8e8" stroke="#458a23" stroke-width="1" rx="4"/>
  <text class="label" x="680" y="318">Notebook cell pattern (in-container):</text>
  <text class="kv"    x="680" y="338">subprocess.run([</text>
  <text class="kv"    x="680" y="354">    "bash", "-lc", flow_script,</text>
  <text class="kv"    x="680" y="370">], ...)</text>
  <text class="sub"   x="680" y="394"><tspan font-style="italic">Bare bash; the notebook IS the container's Jupyter.</tspan></text>

  <!-- Bottom band: which to pick -->
  <rect x="60" y="438" width="1080" height="140" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="4"/>
  <text class="label" x="80" y="460">Which one fits you?</text>

  <!-- Three-column comparison rows. Each row: a label + 2 cells. -->
  <text class="table-hd" x="80"  y="488">criterion</text>
  <text class="table-hd" x="430" y="488">host-driven</text>
  <text class="table-hd" x="800" y="488">in-container</text>

  <text class="table-cell" x="80"  y="510">First-time setup</text>
  <text class="table-cell" x="430" y="510">install Docker + Jupyter on host + bootstrap container</text>
  <text class="table-cell" x="800" y="510">install Docker + start image with port forward</text>

  <text class="table-cell" x="80"  y="528">Mental model</text>
  <text class="table-cell" x="430" y="528">host vs container split, docker exec everywhere</text>
  <text class="table-cell" x="800" y="528">everything in one place, no exec indirection</text>

  <text class="table-cell" x="80"  y="546">KLayout GUI for GDS review</text>
  <text class="table-cell" x="430" y="546">native host (fast)</text>
  <text class="table-cell" x="800" y="546">VNC desktop in container (slower, OK)</text>

  <text class="table-cell" x="80"  y="564">Teaches `docker exec`</text>
  <text class="table-cell" x="430" y="564">yes (useful for tape-out CI)</text>
  <text class="table-cell" x="800" y="564">no (hidden behind Jupyter)</text>

  <text class="footer" x="600" y="608">chipathon-gf180mcu-librelane-examples — diagrams/workflow_comparison.svg</text>
</svg>
