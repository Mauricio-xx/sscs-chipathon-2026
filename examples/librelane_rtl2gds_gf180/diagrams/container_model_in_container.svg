<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" font-family="Helvetica,Arial,sans-serif">
  <title>Host / container / bind-mount model for the in-container chipathon variant</title>
  <desc>
    Jupyter Lab runs INSIDE the gf180 container alongside the EDA tools. The
    host only needs Docker + a web browser. Port 8888 is forwarded from the
    container's Jupyter to the host's localhost; the bind-mount keeps
    project artifacts accessible to both sides.
  </desc>

  <style>
    .title      { font-size:22px; fill:#111; text-anchor:middle; font-weight:bold; }
    .subtitle   { font-size:14px; fill:#444; text-anchor:middle; font-style:italic; }
    .host       { fill:#eef6ff; stroke:#003b73; stroke-width:2; }
    .container  { fill:#eefdef; stroke:#156b2e; stroke-width:2; }
    .label-big  { font-size:17px; fill:#111; font-weight:bold; }
    .label      { font-size:13px; fill:#111; font-weight:bold; }
    .kv         { font-size:12px; fill:#111; font-family:monospace; }
    .sub        { font-size:12px; fill:#444; }
    .bind       { fill:none; stroke:#b00; stroke-width:2.5; stroke-dasharray:6,4; marker-start:url(#arrowhead-red-l); marker-end:url(#arrowhead-red-r); }
    .bind-label { font-size:14px; fill:#b00; font-weight:bold; }
    .arrow      { fill:none; stroke:#555; stroke-width:1.8; marker-end:url(#arrowhead); }
    .port-label { font-size:14px; fill:#0c5b1d; font-weight:bold; }
    .footer     { font-size:11px; fill:#777; text-anchor:middle; }
  </style>

  <defs>
    <marker id="arrowhead" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L0,10 L9,5 z" fill="#555"/>
    </marker>
    <marker id="arrowhead-red-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L0,10 L9,5 z" fill="#b00"/>
    </marker>
    <marker id="arrowhead-red-l" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M9,0 L9,10 L1,5 z" fill="#b00"/>
    </marker>
  </defs>

  <!-- header -->
  <text class="title"    x="550" y="30">Host / container / bind-mount  (in-container variant)</text>
  <text class="subtitle" x="550" y="52">Jupyter Lab + EDA tools both live inside the container; host only needs Docker + a browser</text>

  <!-- Host side (smaller; only browser + docker daemon) -->
  <rect class="host" x="40" y="90" width="380" height="400" rx="8"/>
  <text class="label-big" x="55" y="115">Host (your laptop)</text>
  <text class="sub"        x="55" y="132">Linux/macOS/Windows, Docker Engine, ~40 GB free disk.</text>

  <text class="label" x="55"  y="170">What you need on host:</text>
  <text class="sub"   x="75"  y="190">Docker daemon (to run the image)</text>
  <text class="sub"   x="75"  y="208">A web browser (to talk to the container's Jupyter)</text>
  <text class="sub"   x="75"  y="226"><tspan font-style="italic">No Jupyter, no Python venv, no EDA tools on host.</tspan></text>

  <text class="label" x="55"  y="265">Browser opens:</text>
  <text class="kv"    x="75"  y="285">http://localhost:8888/?token=...</text>
  <text class="sub"   x="75"  y="303">The port-forward (`-p 8888:8888`) makes the</text>
  <text class="sub"   x="75"  y="321">container's Jupyter look like a local service.</text>

  <text class="label" x="55"  y="360">Workspace visible from host:</text>
  <text class="kv"    x="75"  y="378">~/eda/designs/</text>
  <text class="sub"   x="95"  y="396">Same files the container sees at /foss/designs.</text>
  <text class="sub"   x="95"  y="414">Open `final/gds/*.gds` with host KLayout if you</text>
  <text class="sub"   x="95"  y="432">prefer the native review experience.</text>

  <text class="label" x="55"  y="464">Survives `docker rm`:</text>
  <text class="sub"   x="75"  y="481">~/eda/designs/ stays; the container is disposable.</text>

  <!-- Container side (now includes Jupyter Lab) -->
  <rect class="container" x="600" y="90" width="460" height="400" rx="8"/>
  <text class="label-big" x="615" y="115">Container `gf180`</text>
  <text class="sub"        x="615" y="132">hpretl/iic-osic-tools:chipathon26 (~15 GB one-time pull)</text>

  <text class="label" x="615" y="170">Jupyter Lab (in-container, bound to 0.0.0.0:8888):</text>
  <text class="kv"    x="635" y="190">jupyter lab --no-browser --ip 0.0.0.0 --port 8888</text>
  <text class="sub"   x="635" y="208">Runs the notebooks. No `docker exec` indirection.</text>
  <text class="sub"   x="635" y="226">EDA tool calls = bare `subprocess.run(["bash","-lc",...])`.</text>

  <text class="label" x="615" y="262">Bind-mounted workspace:</text>
  <text class="kv"    x="635" y="280">/foss/designs/</text>
  <text class="sub"   x="635" y="298">Same five subdirs as the host (read/write).</text>

  <text class="label" x="615" y="330">PDK tree (used by every notebook):</text>
  <text class="kv"    x="635" y="348">/foss/pdks/gf180mcuD/</text>
  <text class="sub"   x="635" y="366">stdcell libs, LEF, Liberty, SPICE, DRC decks.</text>

  <text class="label" x="615" y="396">EDA tools bundled in image:</text>
  <text class="sub"   x="635" y="414">Yosys, OpenROAD, Magic, KLayout, Netgen, Icarus,</text>
  <text class="sub"   x="635" y="432">cocotb, Verilator, LibreLane, ciel.</text>
  <text class="sub"   x="635" y="450">Also: Firefox (VNC fallback), git, make.</text>

  <text class="label" x="615" y="478">Repository cloned inside container:</text>
  <text class="kv"    x="635" y="490" font-size="11">/foss/designs/sscs-chipathon-2026/...</text>

  <!-- Port forward (TCP 8888) -->
  <path class="arrow" d="M 420 268 L 600 268"/>
  <text class="port-label" x="510" y="261" text-anchor="middle">HTTP :8888</text>
  <text class="sub"        x="510" y="285" text-anchor="middle" font-style="italic">port forward (-p 8888:8888)</text>

  <!-- bind-mount is bidirectional -->
  <path class="bind" d="M 425 388 L 595 388"/>
  <text class="bind-label" x="510" y="380" text-anchor="middle">bind-mount</text>
  <text class="sub"        x="510" y="405" text-anchor="middle" font-style="italic">same physical files</text>

  <!-- bottom band -->
  <rect x="40" y="500" width="1020" height="46" fill="#fafafa" stroke="#ccc" stroke-width="1" rx="4"/>
  <text class="sub" x="550" y="518" text-anchor="middle">
    port forward: <tspan font-family="monospace">-p 8888:8888</tspan>
    &#160;&#160;|&#160;&#160; bind-mount: <tspan font-family="monospace">-v ~/eda/designs:/foss/designs</tspan>
    &#160;&#160;|&#160;&#160; no `docker exec` indirection
  </text>
  <text class="sub" x="550" y="536" text-anchor="middle">
    Bootstrap: <tspan font-family="monospace">docker run -d -p 8888:8888 -v ...</tspan>, clone repo inside, launch Jupyter from `docker exec`, then open localhost:8888.
  </text>

  <text class="footer" x="550" y="558">chipathon-gf180mcu-librelane-examples — diagrams/container_model_in_container.svg</text>
</svg>
